name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    # The runner images no longer ship 3.9, and macOS's own python3 is still 3.9.
    container: python:${{ matrix.python }}-slim
    strategy:
      matrix:
        python: ["3.9", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests
        run: for s in collect render stack carry; do python skills/pr-review-dashboard/scripts/$s.py --self-test; done

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Page script parses
        run: |
          awk '/^<script>$/{f=1;next} /^<\/script>/{f=0} f' skills/pr-review-dashboard/reference/page-template.html > page.js
          node --check page.js
      - name: Fixture pages
        run: python3 tests/fixture.py "$RUNNER_TEMP/fx"
      - name: Browser smoke test
        working-directory: tests
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
          node smoke.mjs "$RUNNER_TEMP/fx/work/page.html" "$RUNNER_TEMP/fx/stack/page.html"

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome check .
      - name: Types and build
        run: bun run build
      - name: Unit tests
        run: bun test
      - name: Browser walk
        run: |
          bunx playwright install --with-deps chromium
          bun tests/smoke.mjs
