name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    # The runner images no longer ship 3.9, and macOS's own python3 is still 3.9.
    container: python:${{ matrix.python }}-slim
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests
        run: for s in collect render stack; do python skills/pr-review-guide/scripts/$s.py --self-test; done

  page-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Page script parses
        run: |
          awk '/^<script>$/{f=1;next} /^<\/script>/{f=0} f' skills/pr-review-guide/reference/page-template.html > page.js
          node --check page.js
